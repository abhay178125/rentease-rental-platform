<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenant Dashboard | RentEase</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark site-nav"><div class="container"><a class="brand" href="../index.html">Rent<span>Ease</span></a><a class="btn btn-primary btn-sm" href="../properties.html">Browse homes</a></div></nav><main class="page-top section"><div class="container"><div class="eyebrow">TENANT DASHBOARD</div><h1 class="page-title">Your rental journey.</h1><div class="row g-4 mt-2"><div class="col-md-4"><div class="stat-card"><span>Saved homes</span><strong id="favCount">0</strong></div></div><div class="col-md-4"><div class="stat-card"><span>Requests</span><strong id="bookingCount">0</strong></div></div><div class="col-md-4"><div class="stat-card"><span>Account</span><strong id="userName">Guest</strong></div></div></div></div></main><script src="../js/storage.js"></script><script>const u=Store.get('currentUser',null);userName.textContent=u?.name||'Guest';favCount.textContent=Store.favorites().length;bookingCount.textContent=Store.get('bookings',[]).filter(x=>x.userId===u?.id).length;</script></body></html>
